<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bloombox - Reset Password</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="authBody">
  <main class="authContainer">
    <section class="auth-card">
      <h1 class="auth-title">Reset your password</h1>
      <p class="auth-subtitle">Make sure your password is at least 8 characters!</p>

      <form class="auth-form" id="resetPasswordForm">
        <label class="auth-label">
          New Password
          <input type="password" name="newPassword" class="auth-input" id="newPassword" required />
          <div id="newPasswordError" style="color: red; display: none;"></div>
        </label>

        <label class="auth-label">
          Confirm Password
          <input type="password" name="confirmPassword" class="auth-input" id="confirmPassword" required />
          <div id="confirmPasswordError" style="color: red; display: none;"></div>
        </label>

        <section class="ForgetPasswordButtons">
          <button type="submit" class="primary-btn">Reset Password</button>
          <button type="button" class="primary-btn" onclick="window.location.href='login.html'">Go Back</button>
        </section>
      </form>
    </section>
  </main>
<script src="script.js"></script>
<script src="preferences.js"></script>
</body>
</html>
