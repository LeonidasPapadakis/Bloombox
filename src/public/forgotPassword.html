<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Bloombox - Login to your Account</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body class="authBody">
  <main class="authContainer">
    <section class="auth-card">
      <h1 class="auth-title">Forgot password?</h1>
      <p class="auth-subtitle"> Enter your email and we'll send a link to reset your password :) </p>

      <form class="auth-form" id="forgotPasswordForm">
        <label class="auth-label">
          Email
          <input type="email" name="email" class="auth-input" id="requestEmail" required />
          <div id="userEmailError" style="color: red; display: none;"></div>
        </label>
        <section class="ForgetPasswordButtons">
          <button type="submit" class="primary-btn">Send Link</button>
          <button type="button" class="primary-btn" onclick="window.location.href='login.html'">Go Back</button>
        </section>
      </form>
    </section>
  </main>
<script src="script.js"></script>
<script src="preferences.js"></script>
